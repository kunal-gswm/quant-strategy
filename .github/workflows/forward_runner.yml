name: TPQSE Forward Runner

on:
  schedule:
    # 16:30 IST = 11:00 UTC, Monday-Friday
    - cron: "0 11 * * 1-5"
  workflow_dispatch:

concurrency:
  group: tpqse-forward-runner
  cancel-in-progress: false

jobs:
  forward-observation:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Required to push changes back
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest -q

      - name: Run forward session
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m forward.runner

      - name: Validate outputs
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m forward.validate_outputs

      - name: Persist forward state
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Only add the forward results directory to avoid committing caches or secrets
          git add results/forward/
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore: persist forward observation state [skip ci]"
            git push
          fi
